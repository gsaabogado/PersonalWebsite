# Netlify serves luissarmiento.com (the GitHub Pages workflow deploys a
# separate, unused Pages site). Astro 7 requires Node >=22.12.0; without
# this pin Netlify builds on an older default Node and fails with
# "Node.js vXX is not supported by Astro!".
[build.environment]
  NODE_VERSION = "22"

# The Corneta pitch page lives at /es/corneta, because the site header reads
# the nav's language off the URL prefix and the page is Spanish. This keeps the
# short URL working for cold emails, and it stops the header's EN switcher —
# which always points at the un-prefixed path — from landing on a 404.
[[redirects]]
  from = "/corneta"
  to = "/es/corneta"
  status = 301
  force = true
